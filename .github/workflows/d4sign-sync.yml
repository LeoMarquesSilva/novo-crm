name: D4Sign sync

on:
  schedule:
    # A cada 5 minutos. A cota da D4Sign é uma janela móvel de 1 hora por
    # método; o cron só usa o que sobra além da reserva para uso no CRM.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: d4sign-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Puxar contratos e signatários
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://crm-indol-ten.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Secret CRON_SECRET ausente neste repositório. Use o mesmo valor configurado na Vercel."
            exit 1
          fi
          code=$(curl --silent --show-error --max-time 150 \
            -o /tmp/d4sign-cron.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/d4sign-sync")
          echo "HTTP ${code}"
          python3 - << 'PY'
          import json
          with open("/tmp/d4sign-cron.json", encoding="utf-8") as handle:
              raw = handle.read()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print(raw[:500])
              raise SystemExit(1)
          listing = data.get("listing") or {}
          phases = data.get("phases") or {}
          folders = data.get("folders") or {}
          enrich = data.get("enrich") or {}
          quota = data.get("quota") or {}
          print(json.dumps({
              "ok": data.get("ok"),
              "error": data.get("error"),
              "listingImported": listing.get("imported"),
              "phasesImported": phases.get("imported"),
              "phasesDone": phases.get("finishedCycle"),
              "folderImported": folders.get("imported"),
              "foldersLeft": folders.get("foldersLeft"),
              "enriched": enrich.get("enriched"),
              "quotaRemaining": quota,
              "rateLimited": data.get("rateLimited") or phases.get("rateLimited") or folders.get("rateLimited") or listing.get("rateLimited"),
          }, ensure_ascii=False))
          PY
          if [ "$code" = "429" ]; then
            echo "Cota D4Sign esgotada nesta hora. A próxima execução retoma."
            exit 0
          fi
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi
